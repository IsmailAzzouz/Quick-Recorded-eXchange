[package]
name = "qrx-web-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "FQ1/QR codec for the QRX browser client"
license = "MIT"
repository = "https://github.com/IsmailAzzouz/Quick-Recorded-eXchange"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
qrcodegen = "1.8"
sha2 = "0.10"
thiserror = "2"
wasm-bindgen = "0.2"
