[package]
name = "qr-video-extractor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-throughput optical air-gap data bridge and QR video streaming suite in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/IsmailAzzouz/Quick-Recorded-eXchange"
keywords = ["qr-code", "video-processing", "zbar", "ffmpeg", "egui"]
categories = ["multimedia::video", "gui"]

[dependencies]
base64 = "0.22"
crossbeam-channel = "0.5"
eframe = { version = "0.33", default-features = true }
num_cpus = "1.17"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
libloading = "0.8"
qrcodegen = "1.8"

[lib]
name = "qr_video_extractor"
path = "src/lib.rs"

[[bin]]
name = "qr-video-extractor"
path = "src/main.rs"

[[bin]]
name = "qr-video-encoder"
path = "src/bin/encoder.rs"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
