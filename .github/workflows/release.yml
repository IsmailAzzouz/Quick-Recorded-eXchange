name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libspeechd-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifacts
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          PKG_NAME="quick-recorded-exchange-${TAG}-${{ matrix.target }}"
          STAGE_DIR="staging/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/qr-video-extractor.exe" "${STAGE_DIR}/"
            cp "target/${{ matrix.target }}/release/qr-video-encoder.exe" "${STAGE_DIR}/"
          else
            cp "target/${{ matrix.target }}/release/qr-video-extractor" "${STAGE_DIR}/"
            cp "target/${{ matrix.target }}/release/qr-video-encoder" "${STAGE_DIR}/"
            chmod +x "${STAGE_DIR}/qr-video-extractor" "${STAGE_DIR}/qr-video-encoder"
          fi

          cp README.md LICENSE "${STAGE_DIR}/"

          mkdir -p dist-packages
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar -a -c -f "dist-packages/${PKG_NAME}.zip" -C staging "${PKG_NAME}"
          else
            tar -czvf "dist-packages/${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            PORTABLE_NAME="quick-recorded-exchange-${TAG}-windows-x86_64-portable"
            PORTABLE_DIR="staging/${PORTABLE_NAME}"
            mkdir -p "${PORTABLE_DIR}"

            cp "target/${{ matrix.target }}/release/qr-video-extractor.exe" "${PORTABLE_DIR}/"
            cp "target/${{ matrix.target }}/release/qr-video-encoder.exe" "${PORTABLE_DIR}/"
            cp README.md LICENSE "${PORTABLE_DIR}/"

            # Bundle ZBar runtime DLLs
            python -m pip install --quiet pyzbar
            PYZBAR_DIR=$(python -c "import pyzbar, os; print(os.path.dirname(pyzbar.__file__))")
            cp "$PYZBAR_DIR/libzbar-64.dll" "${PORTABLE_DIR}/"
            cp "$PYZBAR_DIR/libiconv.dll" "${PORTABLE_DIR}/"

            # Bundle standalone FFmpeg & FFprobe
            curl -L --retry 3 -s -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            unzip -q ffmpeg.zip
            FFMPEG_BIN=$(find . -maxdepth 2 -type d -name "bin" | head -n 1)
            if [ -n "$FFMPEG_BIN" ] && [ -d "$FFMPEG_BIN" ]; then
              cp "$FFMPEG_BIN/ffmpeg.exe" "${PORTABLE_DIR}/"
              cp "$FFMPEG_BIN/ffprobe.exe" "${PORTABLE_DIR}/"
            fi

            tar -a -c -f "dist-packages/${PORTABLE_NAME}.zip" -C staging "${PORTABLE_NAME}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist-packages/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd release-assets
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Quick Recorded eXchange ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
